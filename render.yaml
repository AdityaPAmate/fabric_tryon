# One Free Docker web service, as requested. SQLite/uploads are ephemeral.
# A paid service + /var/data disk is required for persistence across restarts.
# Keep the existing service name if updating an existing Blueprint.
services:
  - type: web
    name: fabric_tryon
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerCommand: bash deploy/render-start.sh
    healthCheckPath: /api/health/
    maxShutdownDelaySeconds: 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GIMMECLIP_API_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DATA_DIR
        value: /var/data
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_PATH
        value: /var/data/db.sqlite3
      - key: SAVE_DEBUG_FILES
        value: "False"
      - key: CATALOG_GENERATION_WORKERS
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5500,http://127.0.0.1:5500"
      - key: VIDEO_POLL_INTERVAL
        value: "5"
      - key: VIDEO_POLL_TIMEOUT
        value: "1200"
      - key: CLOUDFLARE_MODEL
        value: "@cf/black-forest-labs/flux-2-klein-4b"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
